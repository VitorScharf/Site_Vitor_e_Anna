<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Nossas Músicas 🎶</title>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(#fff0f5, #ffffff);
      color: #333;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #ffb6c1;
      padding: 2rem;
      border-bottom: 3px solid #ff8fa3;
    }

    nav a {
      margin: 0 1rem;
      text-decoration: none;
      color: #d6336c;
      font-weight: bold;
    }

    section {
      padding: 2rem;
    }

    iframe {
      margin-top: 1rem;
      width: 90%;
      max-width: 560px;
      border: none;
      border-radius: 12px;
    }

    footer {
      background-color: #ffd5dc;
      padding: 1rem;
      font-size: 0.9rem;
      margin-top: 2rem;
    }

    .music-card {
      margin-bottom: 3rem;
    }

    button {
      background-color: #ff8fa3;
      color: white;
      border: none;
      padding: 0.8rem 1.5rem;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 1rem;
    }

    button:hover {
      background-color: #ff6f91;
    }

  </style>
</head>

<body>

  <header>

    <h1>Nossas Músicas 🎶</h1>

    <nav>
      <a href="index.html">Início</a>
      <a href="historia.html">Nossa História</a>
      <a href="galeria.html">Galeria</a>
      <a href="planos.html">Planos</a>
      <a href="musica.html">Músicas</a>
      <a href="frases.html">Frases 💌</a>
      <a href="dates.html">Dates 💕</a>
    </nav>

  </header>

  <section>

    <p>
      Músicas que me lembram você, basta dar o play e cantar junto 💖
    </p>

    <button onclick="toggleMute()">
      🔇 Mute / Unmute fundo
    </button>

    <audio id="bg-music" autoplay loop>
      <source src="audio_site.wav" type="audio/wav">
      Seu navegador não suporta áudio.
    </audio>

    <!-- PLAYLIST -->

    <div class="music-card">

      <h2>🎧 Nossa Playlist 💖</h2>

      <iframe
        style="border-radius:12px"
        src="https://open.spotify.com/embed/playlist/11IaZQ2S9u3jEqob9VbmvO?utm_source=generator"
        width="100%"
        height="352"
        allowfullscreen=""
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy">
      </iframe>

    </div>

    <!-- SILVER TONGUES -->

    <div class="music-card">

      <h2>Silver Tongues – Louis Tomlinson</h2>

      <iframe
        style="border-radius:12px"
        src="https://open.spotify.com/embed/track/0dQ2isoY2Yja7v5mQTKQOu?utm_source=generator"
        width="100%"
        height="152"
        allowfullscreen=""
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy">
      </iframe>

    </div>

    <!-- SOMEBODY LIKE YOU -->

    <div class="music-card">

      <h2>Somebody Like You – Giant Rooks</h2>

      <iframe
        style="border-radius:12px"
        src="https://open.spotify.com/embed/track/6I5s2uG4Ruxr5ZkHnM7K2S?utm_source=generator"
        width="100%"
        height="152"
        allowfullscreen=""
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy">
      </iframe>

    </div>

    <!-- LITTLE THINGS -->

    <div class="music-card">

      <h2>Little Things – One Direction</h2>

      <iframe
        style="border-radius:12px"
        src="https://open.spotify.com/embed/track/2nMOodYNHBAQ0T7sK0mS1p?utm_source=generator"
        width="100%"
        height="152"
        allowfullscreen=""
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy">
      </iframe>

    </div>

  </section>

  <footer>
    <p>Feito com carinho 💕</p>
  </footer>

  <script>

    const audio = document.getElementById('bg-music');

    function toggleMute() {
      audio.muted = !audio.muted;
    }

  </script>

</body>
</html>
