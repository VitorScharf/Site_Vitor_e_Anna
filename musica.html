<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Nossa Playlist 🎶</title>

  <style>

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(#fff0f5, #ffffff);
      color: #333;
      text-align: center;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    header {
      background-color: #ffb6c1;
      padding: 2rem;
      border-bottom: 3px solid #ff8fa3;
    }

    header h1 {

    nav {

      text-decoration: none;
      color: #d6336c;
      font-weight: bold;
    }

    section {
      padding: 3rem 1rem;
    }

    .playlist-box {

      background: white;

      max-width: 900px;

      margin: auto;

      padding: 2rem;

      border-radius: 24px;

      box-shadow: 0 8px 24px rgba(0,0,0,0.1);

    }

    .playlist-box h2 {
      margin-bottom: 1rem;
      color: #d6336c;
      font-size: 2rem;
    }

    .playlist-box p {
      margin-bottom: 2rem;
      font-size: 1.1rem;
    }

    iframe {

      border-radius: 16px;

      width: 100%;

      height: 700px;

      border: none;

    }

    footer {
      background-color: #ffd5dc;
      padding: 1rem;
      font-size: 0.9rem;
      margin-top: 3rem;
